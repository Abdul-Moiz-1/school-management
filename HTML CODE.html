<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>School Campus Manager</title><style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7589;--bd:#e3e8f1;--ac:#4f46e5;--ac2:#eef0ff;--sb:#141b34;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1322;--card:#171e35;--tx:#e8ecf7;--mu:#97a1bb;--bd:#262f4d;--ac2:#232a52;--sb:#0a0f1f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1322;--card:#171e35;--tx:#e8ecf7;--mu:#97a1bb;--bd:#262f4d;--ac2:#232a52;--sb:#0a0f1f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--sb);color:#cfd6ee;padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex:none}
aside h1{font-size:15px;margin:0 0 2px;color:#fff}aside small{color:#8f9abd;display:block;margin-bottom:8px}

.nav{background:none;border:0;color:#cfd6ee;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;font:inherit}
.nav:hover{background:#ffffff14}.nav.on{background:var(--ac);color:#fff}
.lock{margin-top:auto;padding:10px;border-radius:9px;border:1px dashed #3a4575;background:none;color:#fff;cursor:pointer;font:inherit}
main{flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.top h2{margin:0;font-size:21px}.top p{margin:2px 0 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
button.b,label.b{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;display:inline-block}
button.g{background:var(--ac2);color:var(--ac);border:0;border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit}
button.r{background:none;color:var(--bad);border:0;cursor:pointer;font:inherit}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th{text-align:left;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bd)}tr:hover td{background:var(--ac2)}td input{padding:5px 7px;width:80px}
.tot td{font-weight:700;background:var(--ac2)}.pill{padding:2px 9px;border-radius:20px;background:var(--ac2);color:var(--ac);font-size:12px}
.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools input,.tools select{width:auto;min-width:180px}
#ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#md{background:var(--card);border-radius:16px;max-width:820px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fg label{font-size:12px;color:var(--mu)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:10px;display:none;z-index:99}
.ph{display:none;text-align:center;font-weight:700}
@media print{aside,.tools,.no,button{display:none!important}.ph{display:block}main{padding:0}.card{border:0}body{background:#fff;color:#000}}

:root[data-th=cyan]{--ac:#0891b2;--ac2:#d9f3f9;--sb:#06303a;--bg:#edf8fa}
:root[data-th=brown]{--ac:#92400e;--ac2:#f5e6d8;--sb:#2e1707;--bg:#faf4ee}
:root[data-th=slate]{--ac:#475569;--ac2:#e6eaf0;--sb:#1b2330;--bg:#f2f4f7}
:root[data-th=magenta]{--ac:#c026d3;--ac2:#f8e3fb;--sb:#350b3b;--bg:#fcf1fd}
:root[data-th=gold]{--ac:#ca8a04;--ac2:#fbf0cf;--sb:#33260a;--bg:#fcf8ea}
:root[data-th=forest]{--ac:#166534;--ac2:#dcf3e4;--sb:#0a2915;--bg:#eff8f2}
:root[data-th=navy]{--ac:#1e3a8a;--ac2:#e1e8fb;--sb:#0a1433;--bg:#eef2fc}
:root[data-th=coral]{--ac:#f43f5e;--ac2:#ffe3e8;--sb:#3d0d17;--bg:#fef1f3}
:root[data-th=midnight]{--ac:#38bdf8;--ac2:#0c2a40;--sb:#050b16;--bg:#07101d;--card:#0d1a2b;--bd:#1b3150}
:root[data-th=violetnight]{--ac:#a78bfa;--ac2:#241a4a;--sb:#0b0716;--bg:#0e0a1d;--card:#17122e;--bd:#2c2457}
:root[data-th=amberdark]{--ac:#f59e0b;--ac2:#3a2605;--sb:#120c03;--bg:#0f0b05;--card:#1a1409;--bd:#3d2f12}
:root[data-th=rubydark]{--ac:#fb7185;--ac2:#3d0f1a;--sb:#14060a;--bg:#10070a;--card:#1c0d12;--bd:#43202a}
:root[data-th=tealdark]{--ac:#2dd4bf;--ac2:#06332e;--sb:#03100e;--bg:#04100f;--card:#0a1c1a;--bd:#164440}
:root[data-th=pinkdark]{--ac:#f472b6;--ac2:#3d1030;--sb:#140610;--bg:#10060d;--card:#1c0c17;--bd:#44183a}
:root[data-th=graphite]{--ac:#94a3b8;--ac2:#1e293b;--sb:#0b0f17;--bg:#0f1218;--card:#171c26;--bd:#2a3242}
:root[data-th=limedark]{--ac:#a3e635;--ac2:#213008;--sb:#0b1204;--bg:#0a1005;--card:#131c0a;--bd:#2c3d14}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:22px;cursor:pointer;font:inherit}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw td{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}.tw td select{text-overflow:ellipsis}

.mdv{display:grid;grid-template-columns:minmax(270px,360px) 1fr;gap:14px;align-items:start}.mdv>.card{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;margin-bottom:0}
.li{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid transparent}.li:hover{background:var(--ac2)}.li.on{background:var(--ac2);border-color:var(--ac)}.li small{color:var(--mu)}
.kv{display:grid;grid-template-columns:minmax(130px,42%) 1fr;gap:14px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:baseline}.kv span{color:var(--mu)}.kv b{text-align:left;font-weight:700;color:var(--tx);word-break:break-word}.dp .kv{grid-template-columns:300px 1fr}
.ih{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.fv{display:grid;gap:9px}.fv>div{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center}.fv label{font-size:13px}
@media(max-width:800px){.mdv{grid-template-columns:1fr}.mdv>.card{position:static;max-height:none}.mdv>.card:not(.dp){max-height:55vh}.dp .kv{grid-template-columns:42% 1fr}.mdv>.dp{order:-1}.fv>div{grid-template-columns:1fr;gap:3px}}

header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;background:var(--sb);border-bottom:2px solid var(--ac);color:#fff;flex-wrap:wrap}
header .lg{width:54px;height:54px;border-radius:10px;background:var(--ac2);display:grid;place-items:center;font-size:28px;border:1px solid var(--ac)}
header .tt{text-align:center;flex:1;min-width:240px}header .hw{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%}header h1{display:block;margin:0;font-size:clamp(18px,2.7vw,32px);letter-spacing:.12em;color:var(--ac);border:2px solid var(--ac);border-radius:14px;padding:10px 26px;background:rgba(255,255,255,.04)}
.hr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:9px}.hb{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--c,var(--ac));border-radius:10px;padding:5px 13px;font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;color:#fff;background:rgba(255,255,255,.05)}.hb i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c,var(--ac));color:#fff;font-size:11px}.hb.cr{font-size:15px;padding:6px 20px;border:2px solid transparent;background:linear-gradient(var(--sb),var(--sb)) padding-box,linear-gradient(90deg,#f43f5e,#f59e0b,#eab308,#22c55e,#38bdf8,#a78bfa,#ec4899,#f43f5e) border-box;background-size:auto,300% 100%;animation:hshine 7s linear infinite;box-shadow:0 0 14px #a78bfa55}.hb.cr b{font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#fde047,#f472b6,#38bdf8,#4ade80,#fde047);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hshine2 5s linear infinite}@keyframes hshine{to{background-position:0 0,300% 0}}@keyframes hshine2{to{background-position:200% 0}}button.hb{cursor:pointer}button.hb:hover{filter:brightness(1.25);transform:translateY(-1px)}header .tt p{margin:3px 0 0;font-size:12px;letter-spacing:.08em;color:#dfe8e2}header .rt{font-size:12px;line-height:1.7;color:#dfe8e2}
aside{overflow:auto;top:0}.nav{border:1px solid #ffffff22;margin:3px 0}.nav.on{border-color:var(--ac)}
.ml{font-size:11px;letter-spacing:.12em;font-weight:700;color:#fff;margin:12px 4px 4px}
.sch{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;margin:3px 0;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;cursor:pointer;font:inherit;text-align:left}
.sch i{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}.sch b{margin-left:auto;color:var(--ac)}.sch.on{border-color:var(--ac);background:var(--ac2)}
.exp{width:100%;margin-top:6px;padding:9px;border-radius:9px;border:1px solid var(--ac);background:transparent;color:#fff;cursor:pointer;font:inherit}.exp:hover{background:var(--ac)}
:root[data-th=aqms]{--bg:#050807;--card:#0a130e;--tx:#e8f5e9;--mu:#8fb09a;--bd:#1f3a28;--ac:#22c55e;--ac2:#0f2e1b;--sb:#06100a;--bad:#ef4444;color-scheme:dark}
:root[data-th=aqms]:not([data-pal]) table{border-collapse:separate;border-spacing:4px}
:root[data-th=aqms]:not([data-pal]) th{background:#14532d;color:#fff;border:1px solid #22c55e55;border-radius:8px;text-align:center;font-size:13px;text-transform:none;letter-spacing:0;padding:10px}
:root[data-th=aqms]:not([data-pal]) td{background:#08100b;border:1px solid #1f3a28;border-radius:8px;text-align:center}
:root[data-th=aqms]:not([data-pal]) tr:hover td{background:#0f2e1b}:root[data-th=aqms]:not([data-pal]) .tot td{background:#14532d;color:#fff}
:root[data-th=aqms]:not([data-pal]) .card,:root[data-th=aqms]:not([data-pal]) .kpi{border-radius:16px;border-color:#1f3a28}
:root[data-th=aqms]:not([data-pal]) .top h2{text-transform:uppercase;letter-spacing:.1em;font-size:16px}
:root[data-th=aqms]:not([data-pal]) button.b,:root[data-th=aqms]:not([data-pal]) .tab.on{color:#04210f;font-weight:700}
:root[data-th=aqms]:not([data-pal]) .nav.on{background:#14532d}
:root[data-th=aqms]:not([data-pal]) .bad,:root[data-th=aqms]:not([data-pal]) .ok{text-transform:uppercase}
@media print{header{display:none!important}}
label.g{background:var(--ac2);color:var(--ac);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-block}

.top{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px}
table{border-collapse:collapse}th,td{border:1px solid var(--bd)}th{background:var(--ac2);color:var(--tx);font-weight:700}
.li{border:1px solid var(--bd);background:var(--card);margin-bottom:6px}.li.on{border-color:var(--ac)}
.kv{gap:0;padding:0;margin-bottom:5px;border:1px solid var(--bd);border-radius:8px;overflow:hidden;align-items:stretch}
.kv span{background:var(--ac2);padding:9px 12px;border-right:1px solid var(--bd)}.kv b{padding:9px 12px;border-radius:0}

:root[data-look=modern] button.b,:root[data-look=modern] button.g,:root[data-look=modern] .tab,:root[data-look=modern] .hb,:root[data-look=modern] .exp,:root[data-look=modern] .lock{border-radius:999px}
:root[data-look=modern] input,:root[data-look=modern] select,:root[data-look=modern] textarea{border-radius:14px}

:root[data-look=tech] .nav,:root[data-look=tech] .sch,:root[data-look=tech] button.b,:root[data-look=tech] button.g,:root[data-look=tech] .tab,:root[data-look=tech] .hb,:root[data-look=tech] .exp,:root[data-look=tech] .lock,:root[data-look=tech] input,:root[data-look=tech] select,:root[data-look=tech] header h1,:root[data-look=tech] .kpi{border-radius:0}

:root[data-look=bold] button.b,:root[data-look=bold] button.g,:root[data-look=bold] .tab,:root[data-look=bold] .hb{border:2px solid var(--tx)!important;border-radius:0;box-shadow:3px 3px 0 var(--tx)}
